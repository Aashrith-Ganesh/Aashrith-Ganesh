<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Garden Beds: Language Distribution">
  <defs>
    <linearGradient id="stack-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <clipPath id="stack-clip">
      <rect width="880" height="260" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .sway { animation: sway 4.5s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(2deg); } }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; letter-spacing: 0.05em; }
    .sub { font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace; font-size: 11px; fill: rgba(255,255,255,0.65); letter-spacing: 0.06em; }
    .pct { font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#stack-clip)">
    <rect width="880" height="260" fill="url(#stack-bg)"/>
    <rect width="880" height="260" rx="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Header -->
    <g transform="translate(32, 34)">
      <text x="0" y="0" class="title">BOTANICAL STACK · LANGUAGE DISTRIBUTION BEDS</text>
      <text x="0" y="20" class="sub">Cultivated across active public & personal software repositories</text>
    </g>

    <!-- Terraced Garden Beds -->
    <g transform="translate(32, 85)">

      <!-- Garden Bed Python -->
      <g transform="translate(0, 0)">
        <!-- Bed Container -->
        <rect width="534" height="135" rx="12" fill="#1b4332" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect y="100" width="534" height="35" rx="6" fill="rgba(0,0,0,0.35)"/>

        <!-- Plants inside bed -->
        <g class="sway" style="transform-origin: 40px 105px; animation-delay:-0.0s;">
          <line x1="40" y1="105" x2="40" y2="45" stroke="#40916c" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="34" cy="75" rx="7" ry="3" fill="#40916c" transform="rotate(-30 34 75)"/>
          <ellipse cx="46" cy="60" rx="7" ry="3" fill="#40916c" transform="rotate(30 46 60)"/>
          <circle cx="40" cy="45" r="7" fill="#ffd166"/>
          <circle cx="40" cy="45" r="2.5" fill="#ffffff"/>
        </g>
        <g class="sway" style="transform-origin: 75px 105px; animation-delay:-0.0s;">
          <line x1="75" y1="105" x2="75" y2="35" stroke="#40916c" stroke-width="2.6" stroke-linecap="round"/>
          <ellipse cx="81" cy="65" rx="6" ry="2.5" fill="#40916c" transform="rotate(25 81 65)"/>
          <circle cx="75" cy="35" r="5" fill="#ffd166"/>
        </g>

        <!-- Bed Labels -->
        <text x="16" y="122" class="title" font-size="12px">Python</text>
        <text x="518" y="122" class="pct" text-anchor="end">67%</text>
      </g>
      <!-- Garden Bed HTML -->
      <g transform="translate(546, 0)">
        <!-- Bed Container -->
        <rect width="258" height="135" rx="12" fill="#2c1930" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect y="100" width="258" height="35" rx="6" fill="rgba(0,0,0,0.35)"/>

        <!-- Plants inside bed -->
        <g class="sway" style="transform-origin: 40px 105px; animation-delay:-1.2s;">
          <line x1="40" y1="105" x2="40" y2="45" stroke="#8a3b85" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="34" cy="75" rx="7" ry="3" fill="#8a3b85" transform="rotate(-30 34 75)"/>
          <ellipse cx="46" cy="60" rx="7" ry="3" fill="#8a3b85" transform="rotate(30 46 60)"/>
          <circle cx="40" cy="45" r="7" fill="#f72585"/>
          <circle cx="40" cy="45" r="2.5" fill="#ffffff"/>
        </g>
        <g class="sway" style="transform-origin: 75px 105px; animation-delay:-0.7s;">
          <line x1="75" y1="105" x2="75" y2="35" stroke="#8a3b85" stroke-width="2.6" stroke-linecap="round"/>
          <ellipse cx="81" cy="65" rx="6" ry="2.5" fill="#8a3b85" transform="rotate(25 81 65)"/>
          <circle cx="75" cy="35" r="5" fill="#f72585"/>
        </g>

        <!-- Bed Labels -->
        <text x="16" y="122" class="title" font-size="12px">HTML/Web</text>
        <text x="242" y="122" class="pct" text-anchor="end">33%</text>
      </g>
    </g>
  </g>
</svg>